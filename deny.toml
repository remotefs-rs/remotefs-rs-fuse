# cargo-deny policy for remotefs-rs-fuse.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = [
  # h2 0.3 is required by reqwest 0.11, which is pulled in by the published
  # remotefs-webdav 0.2 backend. The fixed h2 release is a breaking upgrade.
  { id = "RUSTSEC-2026-0258", reason = "transitive h2 0.3 dependency through remotefs-webdav; no compatible backend upgrade" },
  # quick-xml 0.30 and 0.31 are required by the published remotefs-aws-s3
  # and remotefs-webdav backends. The fixed quick-xml release is a breaking
  # upgrade that those backend versions do not support.
  { id = "RUSTSEC-2026-0194", reason = "transitive quick-xml dependency through pinned remotefs backends" },
  { id = "RUSTSEC-2026-0195", reason = "transitive quick-xml dependency through pinned remotefs backends" },
  # rustls-pemfile is unmaintained and the advisory provides no safe upgrade;
  # it remains transitive through the pinned WebDAV and Kubernetes backends.
  { id = "RUSTSEC-2025-0134", reason = "no safe upgrade is available; transitive through pinned remotefs backends" },
  # russh vulnerability; patch is undergoing work and is not yet released.
  { id = "RUSTSEC-2023-0071", reason = "transitive russh dependency through pinned remotefs backends; no safe upgrade is available" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

# The optional WebDAV CLI backend uses rustydav, whose published crate is
# GPL-3.0-only. Keep this exception scoped to that one transitive crate.
[[licenses.exceptions]]
allow = ["GPL-3.0"]
name = "rustydav"

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
