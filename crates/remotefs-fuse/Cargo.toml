[package]
name = "remotefs-fuse"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
documentation = "https://docs.rs/remotefs-fuse"
edition = { workspace = true }
include = ["src/**/*", "LICENSE"]
keywords = { workspace = true }
license = { workspace = true }
readme = "../../README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "A FUSE Driver for remote-fs"

[lints]
workspace = true

[features]
default = ["libfuse"]
integration-tests = []
libfuse = ["fuser/libfuse"]
no-log = ["log/max_level_off"]
tokio = ["dep:futures-util", "dep:tokio", "remotefs/async"]

[dependencies]
futures-util = { workspace = true, features = ["io", "std"], optional = true }
log = { workspace = true }
remotefs = { workspace = true }
seahash = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"], optional = true }

[target.'cfg(unix)'.dependencies]
fuser = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
dashmap = { workspace = true }
dokan = { workspace = true }
dokan-sys = { workspace = true }
path-slash = { workspace = true }
widestring = { workspace = true }
winapi = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
env_logger = { workspace = true }
pretty_assertions = { workspace = true }
remotefs = { workspace = true, features = ["tokio"] }
remotefs-memory = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["user"] }

[lib]
name = "remotefs_fuse"
path = "src/lib.rs"

[package.metadata.docs.rs]
features = ["tokio"]
rustdoc-args = ["--cfg", "docsrs"]
