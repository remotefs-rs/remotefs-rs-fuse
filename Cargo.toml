[workspace]
members = ["crates/remotefs-fuse", "crates/remotefs-fuse-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Christian Visintin <christian.visintin@veeso.dev>"]
categories = ["network-programming"]
edition = "2024"
keywords = ["remote-fs", "fuse-driver", "fuse"]
license = "MIT"
repository = "https://github.com/remotefs-rs/remotefs-rs-fuse"
rust-version = "1.94.1"

[workspace.dependencies]
anyhow = "1"
argh = "0.1"
ctrlc = "3"
dashmap = "6"
dokan = "0.3.1"
dokan-sys = "0.3.1"
env_logger = "0.11"
fuser = "0.16"
libc = "0.2"
log = "0.4"
nix = "0.29"
path-slash = "0.2"
pretty_assertions = "1"
remotefs = "0.3"
remotefs-aws-s3 = "0.4"
remotefs-ftp = "0.4"
remotefs-fuse = { version = "0.1", path = "crates/remotefs-fuse" }
remotefs-kube = "0.4"
remotefs-memory = "0.1"
remotefs-smb = "0.3"
remotefs-ssh = "0.5"
remotefs-webdav = "0.2"
seahash = "4"
serial_test = "3"
tempfile = "3"
thiserror = "2"
tokio = "1"
widestring = "0.4.3"
winapi = "0.3.9"
