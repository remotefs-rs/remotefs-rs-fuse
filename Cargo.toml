[workspace]
members = [
  "crates/fusibile",
  "crates/remotefs-fuse",
]
resolver = "3"

[workspace.package]
version = "1.0.1"
authors = ["Christian Visintin <christian.visintin@veeso.dev>"]
categories = ["network-programming"]
edition = "2024"
keywords = ["remote-fs", "fuse-driver", "fuse"]
license = "MIT"
repository = "https://github.com/remotefs-rs/remotefs-rs-fuse"
rust-version = "1.94.1"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", default-features = false }
dashmap = "6"
dirs = "7"
dokan = "0.3"
dokan-sys = "0.3"
env_logger = "0.11"
fuser = "0.18"
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
log = "0.4"
nix = "0.31"
path-slash = "0.2"
pretty_assertions = "1"
remotefs = "1"
remotefs-aws-s3 = "1"
remotefs-ftp = "1"
remotefs-fuse = { version = "1.0.1", path = "crates/remotefs-fuse" }
remotefs-gcs = "1"
remotefs-kube = "1"
remotefs-memory = "1"
remotefs-smb = { version = "1", default-features = false }
remotefs-ssh = { version = "1", default-features = false }
remotefs-webdav = "1"
seahash = "4"
serde_json = "1"
serial_test = "4"
tempfile = "3"
thiserror = "2"
tokio = "1"
widestring = "0.4"
winapi = "0.3"
