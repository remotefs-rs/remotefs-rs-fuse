name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.1.0 (no leading v)"
        required: true
        type: string
      dry_run:
        description: "Dry run: build & compute everything, push/publish nothing"
        required: true
        type: boolean
        default: true

